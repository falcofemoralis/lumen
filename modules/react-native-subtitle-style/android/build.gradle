apply plugin: 'com.android.library'

group = 'expo.modules.subtitlestyle'
version = '0.0.1'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.subtitlestyle"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
  lintOptions {
    abortOnError false
  }
}

// Subtitles are drawn by media3's own `SubtitleView`, which sits inside the `PlayerView`
// react-native-video builds and is not exposed as a prop. This module reaches it through
// react-native-video's plugin API (`ReactNativeVideoPlugin`), the same way
// `react-native-afr` reaches the player.
//
// Everything below is `compileOnly` on purpose: react-native-video is autolinked into the
// app and brings both itself and its own media3 version at runtime. Declaring either as
// `implementation` would put a second copy on the app's classpath and let this module
// decide the media3 version, which is react-native-video's call to make.
dependencies {
  // The project names come from autolinking, which names them after the package.
  compileOnly project(':react-native-video')

  // Nothing here touches Nitro, but react-native-video's plugin interface has a Nitro
  // hybrid object in the signature of the callbacks this module inherits, so the type has
  // to be resolvable to compile against it.
  compileOnly project(':react-native-nitro-modules')

  // Mirrors `RNVideo_media3Version` in react-native-video's gradle.properties. Only
  // `SubtitleView`, `CaptionStyleCompat` and `PlayerView.getSubtitleView` are touched
  // here, all of which have been stable since media3 1.0 - a newer runtime version needs
  // no change, and this only has to be bumped if the module stops compiling.
  def media3Version = rootProject.ext.has("media3Version") ? rootProject.ext.get("media3Version") : "1.11.0"
  compileOnly "androidx.media3:media3-common:$media3Version"
  compileOnly "androidx.media3:media3-exoplayer:$media3Version"
  compileOnly "androidx.media3:media3-ui:$media3Version"
}
