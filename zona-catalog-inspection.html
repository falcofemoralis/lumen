 Она без памяти влюбляется в загадочного и скрытного одноклассника, но позже узнает, что он происходит из семьи вампиров.\",\"cover_url\":\"https://img2.zonapic.com/images/film_240/401/401177.jpg\",\"backdrop_url\":null,\"backdrop_id\":78084,\"age_limit\":18,\"year\":2008,\"rating\":6.050000000000001,\"rating_kp\":6.7,\"rating_imdb\":5.4,\"rating_count\":1039185,\"duration\":122,\"duration_ms\":7307290,\"directors\":\"Кэтрин Хардвик\",\"writers\":\"Мелисса Розенберг, Стефани Майер\",\"kp_id\":401177,\"upload_date\":\"2021-06-10T17:28:44\",\"best_quality\":\"\",\"release_date\":\"2008-11-17\",\"release_date_ru\":\"2008-11-20\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"vsego-odna-noch-2026\",\"title\":\"Всего одна ночь\",\"title_original\":\"One Night Only\",\"title_eng\":null,\"description\":\"Нью-Йорк, единственная ночь в году, когда разрешён секс. Недавно переживший расставание Оуэн и мечтающая о настоящей любви Элли сталкиваются друг с другом, и между ними сразу возникает симпатия. Однако путь к сближению оказывается непростым, и их разделяют случайные знакомства и недоразумения.\",\"cover_url\":\"https://img1.zonapic.com/images/film_240/10628/10628572.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":17,\"year\":2026,\"rating\":6.2,\"rating_kp\":6.4,\"rating_imdb\":6,\"rating_count\":17127,\"duration\":102,\"duration_ms\":6166290,\"directors\":\"Уилл Глак\",\"writers\":\"Travis Braun\",\"kp_id\":10628572,\"upload_date\":\"2026-09-11T06:24:08\",\"best_quality\":\"\",\"release_date\":\"2026-08-06\",\"release_date_ru\":null,\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"arahnid-2026\",\"title\":\"Арахнид\",\"title_original\":\"Crawlers\",\"title_eng\":null,\"description\":\"Один из жильцов многоквартирного дома, сам того не подозревая, возвращается из поездки со смертоносным живым багажом: новый вид ядовитых пауков быстро ра оме\",\"writers\":\"Бастьен Даре, Дэльфин Глейз, Мари-Пьер Хастер, Жан-Поль Саломе\",\"kp_id\":11009551,\"upload_date\":\"2026-09-02T03:56:31\",\"best_quality\":\"\",\"release_date\":\"2025-09-21\",\"release_date_ru\":\"2026-07-09\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"final-orbit-2026\",\"title\":\"Последняя орбита\",\"title_original\":\"Final Orbit\",\"title_eng\":null,\"description\":\"Четыре истории, четыре разные судьбы. Нападение на корабль, потустороннее вмешательство, критический сбой системы и абсолютное одиночество в бескрайнем космосе. Оказавшись на краю гибели, каждый из героев делает свой выбор и пытается спастись так, как может.\",\"cover_url\":\"https://img3.zonapic.com/images/film_240/14420/14420966.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":18,\"year\":2026,\"rating\":4.5,\"rating_kp\":null,\"rating_imdb\":4.5,\"rating_count\":82,\"duration\":65,\"duration_ms\":4080060,\"directors\":\"Matthew Camfield, Лукас Кендалл\",\"writers\":\"Matthew Camfield\",\"kp_id\":14420966,\"upload_date\":\"2026-10-06T19:49:56\",\"best_quality\":\"\",\"release_date\":\"2026-07-31\",\"release_date_ru\":null,\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"garri-potter-i-filosofskii-kamen\",\"title\":\"Гарри Поттер и философский камень\",\"title_original\":\"Harry Potter and the Sorcerer's Stone\",\"title_eng\":\"Harry Potter and the Sorcerer's Stone\",\"description\":\"Жизнь десятилетнего Гарри Поттера нельзя назвать сладкой: родители умерли, едва ему исполнился год, а от дяди и тёти, взявших сироту на воспитание, достаются лишь тычки да подзатыльники. Но в одиннадцатый день рождения Гарри всё меняется. Странный гость, неожиданно появившийся на пороге, приносит письмо, из которого мальчик узнаёт, что на самом деле он - волшебник и зачислен в школу магии под названием Хогвартс. А уже через пару недель Гарри будет мчаться енный радиопередатчик. Теперь Каслу надо будет попытаться выжить, но это будет весьма непросто.\",\"cover_url\":\"https://img4.zonapic.com/images/film_240/10919/10919087.jpg\",\"backdrop_url\":null,\"backdrop_id\":349187,\"age_limit\":18,\"year\":2026,\"rating\":6.25,\"rating_kp\":6.6,\"rating_imdb\":5.9,\"rating_count\":30091,\"duration\":103,\"duration_ms\":5810500,\"directors\":\"Род Лури\",\"writers\":\"Марк Фридман, Род Лури\",\"kp_id\":10919087,\"upload_date\":\"2026-06-19T06:56:39\",\"best_quality\":\"\",\"release_date\":\"2026-06-26\",\"release_date_ru\":\"2026-08-13\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"shchenyachii-patrul-dinofilm\",\"title\":\"Щенячий патруль: Динофильм\",\"title_original\":\"PAW Patrol: The Dino Movie\",\"title_eng\":null,\"description\":\"Щенячий патруль попадает в шторм и терпит крушение на неизведанном тропическом острове, населённом динозаврами. Здесь они встречают Рекса – щенка, который давно оказался на острове и стал экспертом по динозаврам. Однако их враг, мэр Хамдингер, безрассудно начинает добычу ресурсов, что приводит к пробуждению спящего вулкана. Теперь Щенячьему патрулю предстоит спасти остров и его обитателей от надвигающейся катастрофы.\",\"cover_url\":\"https://img1.zonapic.com/images/film_240/5610/5610120.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":6,\"year\":2026,\"rating\":6.65,\"rating_kp\":7.1,\"rating_imdb\":6.2,\"rating_count\":3170,\"duration\":88,\"duration_ms\":5800460,\"directors\":\"Кэллан Брункер\",\"writers\":\"Кэллан Брункер, Боб Барлен, Кит Чэпман\",\"kp_id\":5610120,\"upload_date\":\"2026-09-11T07:56:35\",\"best_quality\":\"\",\"release_date\":\"2026-07-31\",\"release_date_ru\":null,\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"sumerki-saga-novolunie\",\"title\":\"Сумерки. Сага. Новолуние\",\"title_original\":\"The Twilight Saga: New Moon\",\"title_e траза на переезд в город, но дед никуда уезжать не собирается. В газете он видит заметку об альпийских поселениях, привлекающих миллионы туристов, и решает превратить своё в экодеревню. Чтобы справиться с этой задачей, ему нужна помощь сына и внуков, которым очень непросто вырваться из городской жизни.\",\"cover_url\":\"https://img2.zonapic.com/images/film_240/5426/5426269.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":12,\"year\":2026,\"rating\":7.7,\"rating_kp\":6.9,\"rating_imdb\":8.5,\"rating_count\":3899,\"duration\":94,\"duration_ms\":5652219,\"directors\":\"Мурад Ногмов\",\"writers\":\"Таймураз Бадзиев, Давид Цаллаев, Дмитрий Иванов\",\"kp_id\":5426269,\"upload_date\":\"2026-09-12T07:56:48\",\"best_quality\":\"\",\"release_date\":\"2026-07-30\",\"release_date_ru\":\"2026-07-30\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"motor-siti-2025\",\"title\":\"Мотор Сити\",\"title_original\":\"Motor City\",\"title_eng\":null,\"description\":\"Детройт, 1970-е. Рабочий автозавода Джон Миллер влюбляется в Софию, девушку местного криминального босса Рейнольдса, и та отвечает ему взаимностью. У них завязываются отношения, дело идёт к свадьбе, но бандит решает избавиться от лишнего звена. По его заказу Джона подставляют продажные полицейские, и парень получает 25 лет тюрьмы за преступление, которого не совершал. Спустя пару лет Миллер с помощью друзей-однополчан совершает побег. Теперь у него осталась только одна цель – отомстить тому, кто отнял у него любовь, свободу и прежнюю жизнь.\",\"cover_url\":\"https://img2.zonapic.com/images/film_240/602/602885.jpg\",\"backdrop_url\":null,\"backdrop_id\":349377,\"age_limit\":18,\"year\":2025,\"rating\":6.15,\"rating_kp\":6.1,\"rating_imdb\":6.2,\"rating_count\":8341,\"duration\":103,\"duration_ms\":5686250,\"directors\":\"Potsy Ponciroli\",\"writers\":\"Чад Ст. Джон\",\"kp_id\":602885,\"upload_date\":\"2026-07-23T06:56:41\",\"best_quality\":\"\",\"rel \"duration_ms\":5130710,\"directors\":\"Luke Spears\",\"writers\":\"Matt Bayer, Грэхэм Пауэлл\",\"kp_id\":13457403,\"upload_date\":\"2026-09-15T00:57:14\",\"best_quality\":\"\",\"release_date\":\"2026-08-10\",\"release_date_ru\":null,\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"garri-potter-i-tainaya-komnata\",\"title\":\"Гарри Поттер и Тайная комната\",\"title_original\":\"Harry Potter and the Chamber of Secrets\",\"title_eng\":\"Harry Potter and the Chamber of Secrets\",\"description\":\"Гарри Поттер переходит на второй курс Школы чародейства и волшебства Хогвартс. Эльф Добби предупреждает Гарри об опасности, которая поджидает его там, и просит больше не возвращаться в школу.\\nЮный волшебник не следует совету эльфа и становится свидетелем таинственных событий, разворачивающихся в Хогвартсе. Вскоре Гарри и его друзья узнают о существовании Тайной Комнаты и сталкиваются с новыми приключениями, пытаясь победить темные силы.\",\"cover_url\":\"https://img1.zonapic.com/images/film_240/0/688.jpg\",\"backdrop_url\":null,\"backdrop_id\":99551,\"age_limit\":12,\"year\":2002,\"rating\":7.85,\"rating_kp\":8.2,\"rating_imdb\":7.5,\"rating_count\":1504718,\"duration\":161,\"duration_ms\":10465119,\"directors\":\"Крис Коламбус\",\"writers\":\"Стивен Кловз, Дж.К. Роулинг\",\"kp_id\":688,\"upload_date\":\"2021-06-09T18:08:56\",\"best_quality\":\"\",\"release_date\":\"2002-11-03\",\"release_date_ru\":\"2002-12-26\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"tretii-lishnii-2\",\"title\":\"Третий лишний 2\",\"title_original\":\"Ted 2\",\"title_eng\":null,\"description\":\"Плюшевый беспредельщик продолжает сводить с ума чопорную интеллигенцию. На этот раз говорящий медвежонок с большим эго и его длинноногая блондинка решили завести ребёнка. Там, где не постаралась природа, на помощь приходят звёздные доноры, городские сумасшедшие и верный друг Джонни. Он только что расстался с Лори и готов к новым авантюрам. Третий здесь совсем не лишний.\",\"cover_url\":\"https://img4.zonapic.com/images/film_240/731/731691.jpg\",\"backdrop_url\":null,\"backdrop_id\":194873,\"age_limit\":18,\"year\":2015,\"rating\":6.15,\"rating_kp\":6,\"rating_imdb\":6.3,\"rating_count\":368188,\"duration\":115,\"duration_ms\":6932290,\"directors\":\"Сет Макфарлейн\",\"writers\":\"Алек Салкин, Уэллесли Уайлд, Сет Макфарлейн\",\"kp_id\":731691,\"upload_date\":\"2021-07-01T11:31:17\",\"best_quality\":\"\",\"release_date\":\"2015-06-25\",\"release_date_ru\":\"2015-06-25\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"vverh-po-volshebnomu-derevu\",\"title\":\"Вверх по волшебному дереву\",\"title_original\":\"The Magic Faraway Tree\",\"title_eng\":null,\"description\":\"Семья из города переезжает в деревню – свежий воздух, огород и никаких гаджетов. Пока папа выращивает помидоры, младшая дочь находит в лесу огромное дерево. Стоит забраться на его верхушку – и окажешься в Волшебном королевстве, где возможно почти всё: полёты на автобусе, дома из шоколада, зелья, исполняющие желания. Но цифровой детокс по вкусу не всем: старшая дочь жить не может без соцсетей и мечтает вернуться в город. На помощь ей мчится могущественная бабушка, готовая уничтожить весь лес, и остановить её может только чудо. Но в мире эльфов и фей чудеса буквально растут на ветках.\",\"cover_url\":\"https://img4.zonapic.com/images/film_240/5454/5454871.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":6,\"year\":2026,\"rating\":7.1,\"rating_kp\":7.4,\"rating_imdb\":6.8,\"rating_count\":31009,\"duration\":110,\"duration_ms\":6608630,\"directors\":\"Бен Грегор\",\"writers\":\"Саймон Фарнэби, Энид Блайтон\",\"kp_id\":5454871,\"upload_date\":\"2026-08-29T07:56:43\",\"best_quality\":\"\",\"release_date\":\"2026-03-26\",\"release_date_ru\":\"2026-05-07\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploa менно управляет ведущим в городе предприятием по производству мёда. Однажды в город возвращается Катери, его приёмная дочь, и Амзиа решает восстановить связь и привлечь девушку к семейному бизнесу, предложив вместе с ним ухаживать за пасекой. Катери с радостью соглашается и постепенно втягивается в новое для неё дело. Но однажды все ульи похищают.\",\"cover_url\":\"https://img2.zonapic.com/images/film_240/5367/5367673.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":18,\"year\":2025,\"rating\":6.550000000000001,\"rating_kp\":6.2,\"rating_imdb\":6.9,\"rating_count\":8525,\"duration\":130,\"duration_ms\":7836790,\"directors\":\"Andrew Patterson\",\"writers\":\"Andrew Patterson\",\"kp_id\":5367673,\"upload_date\":\"2026-09-18T16:56:46\",\"best_quality\":\"\",\"release_date\":\"2025-03-10\",\"release_date_ru\":\"2026-11-19\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"mertvoe-mesto\",\"title\":\"Мёртвое место\",\"title_original\":\"The Dead Place\",\"title_eng\":null,\"description\":\"Айзек — старшеклассник с непростой судьбой, которого мучают видения злых духов. По мере того как на него обрушиваются жестокий буллинг в школе и трагедия в семье, потусторонние силы преследуют его всё агрессивнее. Это вынуждает парня открыть в себе пугающую склонность к жестокости, о которой он раньше и не подозревал.\",\"cover_url\":\"https://img2.zonapic.com/images/film_240/5213/5213645.jpg\",\"backdrop_url\":null,\"backdrop_id\":null,\"age_limit\":18,\"year\":2026,\"rating\":7.1,\"rating_kp\":null,\"rating_imdb\":7.1,\"rating_count\":247,\"duration\":101,\"duration_ms\":6092080,\"directors\":\"Michael Pickle\",\"writers\":\"Michael Pickle\",\"kp_id\":5213645,\"upload_date\":\"2026-09-11T15:56:41\",\"best_quality\":\"\",\"release_date\":\"2026-06-01\",\"release_date_ru\":null,\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"shrek\",\"title\":\"Шрэк\",\"title_original\":\"Shrek\",\"title_eng\":\"Shrek\",\"description\":\"Жил да был в сказочном государстве большой зеленый великан по имени Шрэк. Жил он в гордом одиночестве в лесу, на болоте, которое считал своим. Но однажды злобный коротышка – лорд Фаркуад, правитель волшебного королевства, безжалостно согнал на Шрэково болото всех сказочных обитателей.\\nИ беспечной жизни зеленого великана пришел конец. Но лорд Фаркуад пообещал вернуть Шрэку болото, если великан добудет ему прекрасную принцессу Фиону, которая томится в неприступной башне, охраняемой огнедышащим драконом.\",\"cover_url\":\"https://img3.zonapic.com/images/film_240/0/430.jpg\",\"backdrop_url\":null,\"backdrop_id\":96919,\"age_limit\":18,\"year\":2001,\"rating\":8.05,\"rating_kp\":8.2,\"rating_imdb\":7.9,\"rating_count\":1770572,\"duration\":90,\"duration_ms\":5408460,\"directors\":\"Эндрю Адамсон, Вики Дженсон\",\"writers\":\"Тед Эллиот, Терри Россио, Джо Стиллман, Роджер С.Х. Шульман, Уильям Стейг, Коуди Кэмерон, Крис Миллер, Конрад Вернон\",\"kp_id\":430,\"upload_date\":\"2024-11-12T02:57:42\",\"best_quality\":\"\",\"release_date\":\"2001-04-22\",\"release_date_ru\":\"2001-10-31\",\"release_date_dvd\":null,\"release_date_bluray\":null,\"uploaded_by\":null,\"is_trailer\":false},{\"slug\":\"sumerki-saga-rassvet-chast-2\",\"title\":\"Сумерки. Сага. Рассвет: Часть 2\",\"title_original\":\"The Twilight Saga: Breaking Dawn - Part 2\",\"title_eng\":null,\"description\":\"Белла, став вампиром, постепенно свыкается со своей новой природой. В этом ей помогают Эдвард и остальные члены семьи Калленов. К тому же теперь у Беллы есть дочь Ренесми и вечность впереди. Джейкоб, запечатленный с Ренесми, становится для девочки другом и наставником. Ненадолго для героев наступают спокойные, счастливые дни.\\nВсе заканчивается, когда вести о Ренесми доходят до Вольтури. «Обращение» детей строго запрещено в мире вампиров. Не зная о необычном происхождении Ренесми, Вольтури собирают армию и направляются в Форкс, чтобы у
